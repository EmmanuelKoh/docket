# Runs the same gate as `npm run check` on every push and pull request.
# Tests use in-memory PGlite and fake Redis/Blob clients, so CI needs no
# secrets and never reaches a cloud store.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
